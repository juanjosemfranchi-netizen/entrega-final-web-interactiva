<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Cotizaciones y Compras IT</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Toastify CSS (Librería Externa) -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <!-- CSS Propio -->
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">💻 TechStore - Cotizador Online</span>
      <button class="btn btn-outline-light" id="btn-ver-carrito" data-bs-toggle="modal" data-bs-target="#modalCarrito">
        🛒 Carrito (<span id="contador-carrito">0</span>)
      </button>
    </div>
  </nav>

  <main class="container">
    <!-- Filtros y Búsqueda -->
    <div class="row mb-4 g-3">
      <div class="col-md-6">
        <input type="text" id="input-busqueda" class="form-control" placeholder="Buscar por nombre...">
      </div>
      <div class="col-md-6">
        <select id="select-categoria" class="form-select">
          <option value="todos">Todas las categorías</option>
          <option value="Servidores">Servidores</option>
          <option value="Redes">Redes</option>
          <option value="Seguridad">Seguridad</option>
          <option value="CCTV">CCTV</option>
        </select>
      </div>
    </div>

    <!-- Contenedor de Catálogo -->
    <div class="row" id="contenedor-productos">
      <!-- Inyección dinámica mediante DOM -->
    </div>
  </main>

  <!-- Modal del Carrito -->
  <div class="modal fade" id="modalCarrito" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Detalle de tu Carrito</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="contenedor-items-carrito"></div>
          <hr>
          <div class="d-flex justify-content-between align-items-center">
            <h4>Total: USD $<span id="precio-total">0</span></h4>
            <button id="btn-vaciar" class="btn btn-outline-danger">Vaciar Carrito</button>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Seguir comprando</button>
          <button type="button" id="btn-confirmar" class="btn btn-success">Finalizar Compra</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- SweetAlert2 & Toastify (Librerías externas) -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <!-- Scripts Propios (2 de los 3 permitidos) -->
  <script src="js/storage.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
